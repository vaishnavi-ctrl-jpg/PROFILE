<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="toolGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g stroke="url(#toolGrad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#toolGlow)">
    <line x1="20" y1="80" x2="75" y2="25" />
    <line x1="80" y1="80" x2="25" y2="25" stroke="#FF9EAA" />
  </g>
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="20" y1="80" x2="75" y2="25" />
    <line x1="80" y1="80" x2="25" y2="25" />
  </g>
  <circle cx="75" cy="25" r="10" fill="#0D0620" stroke="#FF9EAA" stroke-width="3" filter="url(#toolGlow)" />
  <rect x="15" y="15" width="24" height="14" rx="3" fill="#FF9EAA" filter="url(#toolGlow)" />
</svg>
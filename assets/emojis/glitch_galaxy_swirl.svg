<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="galGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="galGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Galaxy Spiral Arms -->
  <g fill="none" stroke="url(#galGrad)" stroke-width="7" stroke-linecap="round" filter="url(#galGlow)">
    <path d="M 50 50 Q 80 30 85 55 Q 90 80 50 85 Q 10 90 15 50 Q 20 15 50 15" />
    <path d="M 50 50 Q 20 70 15 45 Q 10 20 50 15" stroke-width="4" stroke="#FFFFFF" />
  </g>
  <!-- Core Star -->
  <circle cx="50" cy="50" r="10" fill="#FFFFFF" filter="url(#galGlow)" />
  <!-- Glitch Blocks -->
  <rect x="25" y="38" width="18" height="4" fill="#FF007F" />
  <rect x="60" y="58" width="22" height="4" fill="#00F0FF" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.3" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Dark Base Frame -->
  <rect width="1000" height="140" rx="12" fill="#080314" stroke="#251147" stroke-width="2" />
  <rect width="1000" height="140" rx="12" fill="url(#scanlines)" />

  <!-- Glitch Text Layer Behind (Cyan Shift) -->
  <text x="502" y="77" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#00F0FF" opacity="0.7" letter-spacing="4">
    VAISHNAVI // IDENTITY.CTRL.JPG
  </text>

  <!-- Glitch Text Layer Behind (Pink Shift) -->
  <text x="497" y="74" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#FF007F" opacity="0.7" letter-spacing="4">
    VAISHNAVI // IDENTITY.CTRL.JPG
  </text>

  <!-- Main Text Layer -->
  <text x="500" y="75" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="url(#headerGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    VAISHNAVI // IDENTITY.CTRL.JPG
  </text>

  <!-- Subtitle Tagline -->
  <text x="500" y="112" font-family="Courier, monospace" font-size="16" fill="#A0AEC0" text-anchor="middle" letter-spacing="3">
    [ SYSTEM_STATUS: ONLINE ] · [ REBOOT_SEQUENCE: COMPLETE ] · [ AI &amp; FULLSTACK ]
  </text>
</svg>

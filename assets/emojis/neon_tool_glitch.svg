<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="toolGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g stroke="url(#toolGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#toolGlow)">
    <!-- Wrench (Diagonal) -->
    <line x1="20" y1="80" x2="75" y2="25" />
    <!-- Hammer (Diagonal) -->
    <line x1="80" y1="80" x2="25" y2="25" stroke="#FF007F" />
  </g>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="20" y1="80" x2="75" y2="25" />
    <line x1="80" y1="80" x2="25" y2="25" />
  </g>
  <!-- Wrench Head Circle -->
  <circle cx="75" cy="25" r="10" fill="#0D0620" stroke="#00F0FF" stroke-width="4" filter="url(#toolGlow)" />
  <!-- Hammer Head Rect -->
  <rect x="15" y="15" width="24" height="14" rx="3" fill="#FF007F" filter="url(#toolGlow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="pageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- RGB Glitch Shift Shadow (Cyan & Pink) -->
  <path d="M 23 15 L 63 15 L 78 30 L 78 85 L 23 85 Z" fill="none" stroke="#00F0FF" stroke-width="4" opacity="0.8" />
  <path d="M 27 15 L 67 15 L 82 30 L 82 85 L 27 85 Z" fill="none" stroke="#FF007F" stroke-width="4" opacity="0.8" />
  <!-- Main Document Body -->
  <path d="M 25 15 L 65 15 L 80 30 L 80 85 L 25 85 Z" fill="#0D0620" stroke="url(#pageGrad)" stroke-width="3" filter="url(#pageGlow)" />
  <path d="M 65 15 L 65 30 L 80 30" fill="none" stroke="url(#pageGrad)" stroke-width="3" />
  <!-- Glitch Code Lines -->
  <line x1="33" y1="35" x2="60" y2="35" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <line x1="33" y1="45" x2="72" y2="45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="33" y1="55" x2="52" y2="55" stroke="#FF007F" stroke-width="3" stroke-linecap="round" />
  <line x1="33" y1="65" x2="68" y2="65" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <line x1="33" y1="75" x2="58" y2="75" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
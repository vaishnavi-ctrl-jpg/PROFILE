<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC0CB" />
      <stop offset="50%" stop-color="#E8D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <style>
      .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: url(#headerGrad); }
      .stat { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
      .bold { font-weight: 700; fill: #f0f6fc; }
      .icon { fill: #FFC0CB; }
      .rank-title { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #FFC0CB; }
      .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E8D5FF; }
    </style>
  </defs>
  <rect width="495" height="195" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <g transform="translate(25, 35)">
    <!-- Header -->
    <text x="0" y="0" class="header">Vaishnavi's GitHub Stats</text>
  </g>

  <g transform="translate(25, 70)">
    <!-- Total Stars -->
    <g transform="translate(0, 0)">
      <svg x="0" y="-12" width="16" height="16" viewBox="0 0 16 16" class="icon"><path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"></path></svg>
      <text x="25" y="0" class="stat">Total Stars Earned:</text>
      <text x="200" y="0" class="stat bold">28</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 30)">
      <svg x="0" y="-12" width="16" height="16" viewBox="0 0 16 16" class="icon"><path fill-rule="evenodd" d="M1.65 1.5A1.75 1.75 0 000 3.25v9.5c0 .966.784 1.75 1.75 1.75h12.5A1.75 1.75 0 0016 12.75v-9.5A1.75 1.75 0 0014.25 1.5H1.65zm0 1.5h12.6c.138 0 .25.112.25.25v9.5a.25.25 0 01-.25.25H1.65a.25.25 0 01-.25-.25v-9.5c0-.138.112-.25.25-.25z"></path></svg>
      <text x="25" y="0" class="stat">Total Commits (2026):</text>
      <text x="200" y="0" class="stat bold">276+</text>
    </g>

    <!-- PRs & Contributed Repos -->
    <g transform="translate(0, 60)">
      <svg x="0" y="-12" width="16" height="16" viewBox="0 0 16 16" class="icon"><path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 018.75 3.25z"></path></svg>
      <text x="25" y="0" class="stat">AI &amp; ML Repositories:</text>
      <text x="200" y="0" class="stat bold">46 Repos</text>
    </g>

    <!-- Global Rank Badge -->
    <g transform="translate(320, 20)">
      <circle cx="50" cy="30" r="40" fill="#161b22" stroke="url(#headerGrad)" stroke-width="2"/>
      <text x="50" y="24" class="rank-title" text-anchor="middle">GRADE</text>
      <text x="50" y="48" class="rank-text" text-anchor="middle">A+</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="triGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Neon Glow Triangle -->
  <polygon points="50,12 88,82 12,82" fill="none" stroke="url(#triGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#triGlow)" />
  <!-- Inner White Core Triangle -->
  <polygon points="50,16 84,80 16,80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  <!-- Lightning Arc Details -->
  <path d="M 45 20 L 52 35 L 48 50 L 58 75" fill="none" stroke="#00F0FF" stroke-width="2" />
</svg>